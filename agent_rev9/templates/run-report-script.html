<script>
function renderReportProvenance(d){
  if(!d.provenance) return;
  const box=document.createElement('p');
  box.style.cssText='padding:12px;font-size:12px';
  box.textContent='Data scope: '+d.provenance.volcano_sampling+' | PCA: '+d.provenance.pca_sampling;
  (document.querySelector('.report-body')||document.querySelector('.content')||document.body).prepend(box);
}
function renderVisualDiagnostic(d){

  window.diagnosticErrors=window.diagnosticErrors||[];

  window.addEventListener('unhandledrejection',e=>window.diagnosticErrors.push(String(e.reason)));
  const css=document.createElement('style');css.textContent=`

  #visual-diagnostic p{margin:6px 0 12px}#visual-diagnostic .muted{color:#607084}#visual-diagnostic .vd-meta{font-size:13px;overflow-wrap:anywhere}
  #visual-diagnostic .vd-badges{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}#visual-diagnostic .badge{font-size:12px;font-weight:650;background:#e8edf3;color:#364b63;border-radius:5px;padding:4px 8px;display:inline-block}
  #visual-diagnostic .warn{background:#fff0d7;color:#865206}#visual-diagnostic .pass{background:#e4f2e9;color:#1d633b}#visual-diagnostic .fail{background:#fce8e6;color:#9a3028}
  #visual-diagnostic .vd-stats{display:flex;gap:24px;flex-wrap:wrap;margin:16px 0;font-size:14px}#visual-diagnostic .vd-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:16px 0}
  #visual-diagnostic .vd-card,#visual-diagnostic section,#visual-diagnostic .vd-priority{background:#fff;border:1px solid #d6dee8;border-radius:10px;padding:18px}
  #visual-diagnostic .vd-card{font-size:13px;min-width:0}#visual-diagnostic .vd-card .result{font-size:15px;font-weight:650;margin:10px 0}
  #visual-diagnostic .vd-priority{border-left:4px solid #c18129;margin:16px 0}#visual-diagnostic .vd-priority p{margin:3px 0;font-size:13px}

  #visual-diagnostic button{border:1px solid #c5d0de;background:#fff;color:#28425d;font:inherit;font-size:13px;border-radius:6px;padding:8px 13px;cursor:pointer}
  #visual-diagnostic button[aria-selected=true]{background:#203e60;color:#fff}#visual-diagnostic section{margin:0 0 18px;scroll-margin-top:75px}
  #visual-diagnostic [hidden]{display:none!important}#visual-diagnostic figure{margin:20px 0;border:1px solid #dce3eb;border-radius:8px;overflow:hidden;background:#fff}
  #visual-diagnostic figure img{display:block;width:100%;height:auto}#visual-diagnostic figcaption{padding:12px 16px;background:#f8fafc;font-size:13px}#visual-diagnostic figure a{margin-right:14px}

  #visual-diagnostic .table-wrap{max-width:100%;overflow:auto}#visual-diagnostic table{width:100%;border-collapse:collapse;font-size:12px;margin:12px 0}
  #visual-diagnostic th{background:#eef2f6;text-align:left;color:#304860}#visual-diagnostic td,#visual-diagnostic th{padding:9px;border-bottom:1px solid #e0e6ed;vertical-align:top;overflow-wrap:anywhere}
  #visual-diagnostic pre{font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:500px;overflow:auto}
  #visual-diagnostic .vd-status{padding:14px;background:#eef2f6;border-radius:6px;margin:12px 0;font-size:13px}#visual-diagnostic .vd-issues th:nth-child(4){min-width:180px}
  @media(max-width:850px){#visual-diagnostic .vd-cards{grid-template-columns:repeat(2,minmax(0,1fr))}#visual-diagnostic main{padding:18px}#visual-diagnostic h1{font-size:25px}}
  `;document.head.append(css);
  const el=(p,t,text,cls)=>{const n=document.createElement(t);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;p.append(n);return n;};
  const safe=v=>{if(v===null||v===undefined||v==='')return 'not_available';if(typeof v==='number')return Number.isFinite(v)?String(Math.round(v*10000)/10000):'not_available';if(typeof v==='object')return JSON.stringify(v,(k,x)=>typeof x==='string'?clean(x):x,null,2);return clean(String(v));};
  const clean=v=>v.replace(/\/(?:NHNHOME|home|tmp)\/[^\s"',;]+/g,x=>x.split('/').pop());
  const badge=(p,v)=>el(p,'span',safe(v),'badge '+(/FAIL|ERROR/.test(v)?'fail':/HOLD|WARN/.test(v)?'warn':/^PASS/.test(v)?'pass':''));
  const detail=(p,label,obj)=>{const x=el(p,'details');el(x,'summary',label);if(obj!==undefined)el(x,'pre',safe(obj));return x;};
  const table=(p,rows,cols)=>{const w=el(p,'div',undefined,'table-wrap'),t=el(w,'table'),h=el(t,'thead'),tr=el(h,'tr');cols.forEach(c=>el(tr,'th',c[0]));const body=el(t,'tbody');rows.forEach(r=>{const tr=el(body,'tr');cols.forEach(c=>el(tr,'td',safe(typeof c[1]==='function'?c[1](r):r[c[1]])));});return t;};
  const art=path=>(d.artifacts||[]).find(a=>a.path===path);
  const link=(p,path,label)=>{const a=art(path);if(a&&a.available&&a.href){const x=el(p,'a',label);x.href=a.href;return x;}return el(p,'span',label+' · source unavailable','muted');};
  const top=el(document.body,'header',undefined,'vd-top');el(top,'strong','OmiCraft / Diagnostic review');el(top,'span','REAL RESULTS · NO MOCK DATA','vd-meta');

  el(stats,'span',current.length+' new analysis attempts · '+s.heavy_model_inference_calls+' new model calls');el(stats,'span',historical.length+' historical records retained');el(stats,'span',current.filter(a=>a.status==='COMPLETED').length+' completed / '+current.filter(a=>a.status==='FAILED').length+' failed / '+mods.filter(m=>m.display_execution_status==='BLOCKED_INPUT').length+' blocked route');
  const gpuLines=(s.gpu?.snapshot?.stdout||'').trim().split('\n').slice(1).map(x=>x.split(',').map(y=>y.trim())).filter(x=>[4,5,6,7].includes(Number(x[0])));el(main,'p','GPU snapshot: '+gpuLines.map(x=>'GPU '+x[0]+' '+x[3]+' MiB / '+x[5]+'%').join(' · ')+'. New GPU processes: 0.','vd-meta');
  const names={SMALL_MOLECULE:'Small molecule',DE_NOVO_BINDER:'Binder',ADC:'ADC',DEGRADER:'Degrader'};

  const cards=el(main,'div',undefined,'vd-cards');mods.forEach(m=>{const c=el(cards,'article',undefined,'vd-card');el(c,'h3',names[m.modality]);badge(c,m.display_execution_status);badge(c,m.critic_decision);const mm=m.demo_metrics||{};const brief=!Object.keys(mm).length?'Diagnostic data unavailable':m.modality==='SMALL_MOLECULE'?`${mm.poses?.length||0} GNINA poses · ${m.summary?.candidates?.[0]?.af3_ligand?.samples?.length||0} AF3 sample(s) · ${mm.admet_endpoints?.length||0} ADMET endpoints`:m.modality==='DE_NOVO_BINDER'?`iPTM ${safe(mm.iptm)} · ${mm.developability?.length||0} residue binder`:m.modality==='ADC'?`${safe(mm.contact_count)} CDR contacts · ${mm.conjugation?.candidates?.length||0} computational site candidates`:mm.input_mode==='published_full_molecule'?`${mm.candidate_id} · Published reference · Full-molecule QC ${mm.full_molecule_validation}`:'Real warhead QC · assembly blocked by missing inputs';el(c,'div',brief,'result');if(mm.input_mode==='published_full_molecule'){badge(c,'PUBLISHED DEGRADER');el(c,'p','Assembly: '+mm.assembly_status+' · Ternary: '+mm.ternary_status);}el(c,'p',(m.evidence_modes||[]).map(x=>x.replaceAll('_',' ')).join(' + '),'muted');el(c,'p','Tools: '+(m.selected_tools||[]).join(' → '));el(c,'div',current.filter(a=>a.modality===m.modality).length+' new analysis · '+historical.filter(a=>a.modality===m.modality&&a.kind==='model_inference').length+' replayed model records');el(c,'p',m.issues?.find(i=>i.status==='OPEN')?.observed_evidence||'No technical blocker recorded.');});
  const priorities=el(main,'div',undefined,'vd-priority');el(priorities,'strong','Review priorities');issues.filter(i=>i.status==='OPEN'&&i.priority!=='P2').slice(0,4).forEach(i=>el(priorities,'p',i.priority+' · '+i.modality+' — '+i.observed_evidence));
  const flow=el(main,'div',undefined,'vd-flow');['User question · ERBB2','Omics discovery · SOURCE MISSING','Qualification · NOT EVALUATED','Modality evaluation · comparative','Tool planning · replay / CPU analysis','Tool execution · real artifacts','Validation · complete','Critic · HOLD / warnings'].forEach(x=>el(flow,'span',x));
  const nav=el(main,'nav');nav.setAttribute('role','tablist');nav.setAttribute('aria-label','Diagnostic sections');
  const panels={},buttons={};
  function tab(name){const id=name.toLowerCase().replaceAll(' ','-'),b=el(nav,'button',name),p=el(main,'section');b.setAttribute('role','tab');b.id='tab-'+id;b.setAttribute('aria-controls','panel-'+id);p.id='panel-'+id;p.setAttribute('role','tabpanel');p.setAttribute('aria-labelledby',b.id);buttons[name]=b;panels[name]=p;el(p,'h2',name);b.onclick=()=>show(name);return p;}
  function show(name){for(const [key,p] of Object.entries(panels)){p.hidden=name!=='All sections'&&key!==name;buttons[key].setAttribute('aria-selected',String(key===name));}all.setAttribute('aria-selected',String(name==='All sections'));}
  const om=tab('Omics');el(om,'p','Existing TCGA/Qualification evidence is kept separate from the therapeutic run. No new Omics analysis was run.');
  table(om,s.omics||[],[['View','name'],['Status','status'],['Source run','source_run_id'],['Reason','reason']]);el(om,'div',s.qualification_status,'vd-status');
  function issuesTable(parent,rows){const t=table(parent,rows,[['Priority','priority'],['Modality / stage',r=>r.modality+' / '+r.stage],['Category','category'],['Evidence','observed_evidence'],['Confirmed cause','confirmed_cause'],['Recommended fix','recommended_fix'],['Status','status']]);t.className='vd-issues';rows.filter(r=>r.hypothesized_cause).forEach(r=>{const box=el(parent,'div',undefined,'vd-status');badge(box,'Hypothesis');el(box,'span',' '+r.issue_id+': '+r.hypothesized_cause);});}
  function attemptsTable(parent,rows){table(parent,rows,[['Attempt','attempt_id'],['Tool / stage',r=>r.tool+' / '+r.stage],['Mode',r=>r.evidence_mode+(r.historical?' (historical)':'')],['Seed','seed'],['GPU physical / logical',r=>r.physical_gpu_id==null?'CPU / not allocated':r.physical_gpu_id+' / '+r.logical_gpu_id],['Started','started_at'],['Finished','finished_at'],['Exit','exit_code'],['Status','status'],['Representative',r=>(r.selected?'Yes: ':'No: ')+r.selection_reason],['Metrics','metrics'],['Error','error_message']]);}
  function renderReference(p,m){
    const v=m.demo_metrics,q=v.qc||{},prov=v.provenance||{},bs=el(p,'div',undefined,'vd-badges');
    ['PUBLISHED DEGRADER','CURATED REFERENCE CANDIDATE','NOT A NOVEL AGENT-DESIGNED MOLECULE'].forEach(x=>badge(bs,x));
    el(p,'h3','SJF1528 · Published HER2/EGFR degrader');el(p,'p','Origin: Published reference · Target context: HER2/EGFR · E3 ligase: VHL · Input mode: Full molecule · Novel design: No');
    (m.visualizations||[]).forEach(path=>{const a=art(path);if(!a?.available)return;const f=el(p,'figure'),im=el(f,'img');im.src=a.href;im.alt=a.title;const cap=el(f,'figcaption');el(cap,'strong',a.title);el(cap,'p',a.caption);link(cap,a.source_table,'RDKit source data');});
    el(p,'h3','Molecular properties');table(p,[q],[['Formula','molecular_formula'],['MW (g/mol)','molecular_weight'],['Charge','formal_charge'],['Stereocenters','stereocenter_count'],['HBD / HBA',r=>r.hbd+' / '+r.hba],['Rotatable bonds','rotatable_bonds'],['TPSA (Å²)','tpsa'],['logP','logp'],['Rings','ring_count']]);
    el(p,'p','Property profile: '+q.property_profile+'. A beyond-Rule-of-Five profile is a development warning, not evidence of degradation failure.');
    table(p,[q],[['Conformer','conformer_generation_status'],['Force field','force_field'],['Optimization','optimization_status'],['Hydrogens before / after',r=>r.hydrogen_count_before+' / '+r.hydrogen_count_after],['Force-field energy (kcal/mol)','energy_if_available']]);
    el(p,'h3','Literature and current calculation');el(p,'p','The primary publication reports an RTK degrader affecting HER2 and EGFR. This run checks chemical identity and prepares a free conformer; it does not measure degradation.');
    const cite=el(p,'a','Primary publication · DOI '+prov.primary_doi);cite.href='https://doi.org/'+prov.primary_doi;el(p,'p',prov.curation_message);detail(p,'Chemical provenance and unmodified input',prov);
    el(p,'h3','Component and assembly status');el(p,'div','Component decomposition: NOT VERIFIED · Assembly: NOT APPLICABLE FOR FULL-MOLECULE INPUT','vd-status');table(p,Object.entries(v.fields||{}).map(([field,value])=>({field,status:value===null?'NOT AVAILABLE':'SUPPLIED, NOT VERIFIED'})),[['Field','field'],['Status','status']]);
    el(p,'h3','Ternary readiness');el(p,'div',v.ternary_status+' · AF3: NOT RUN · Degradation efficacy: NOT EVALUATED','vd-status');el(p,'p',v.ternary_readiness?.reason);table(p,v.ternary_readiness?.sequences||[],[['Entity','entity'],['Local selected input verified','available'],['Chain','chain'],['Residues','sequence_length']]);detail(p,'Readiness checks',v.ternary_readiness);
    el(p,'h3','Selection and execution trace');table(p,m.decision_trace||[],[['Stage','stage'],['Execution mode','mode'],['Reason','message']]);
    const old=detail(p,'Previous attempt: TAK-285-only input · BLOCKED_INPUT',m.previous_attempt);link(old,m.previous_attempt_path,'Original blocked attempt');el(p,'p','TAK-285 remains the Small molecule candidate. TAK-285 degrader design: NOT EVALUATED.');
  }
  mods.forEach(m=>{const p=tab(names[m.modality]),metrics=m.demo_metrics||{};el(p,'p',m.agent_reason||'Inspect the recorded technical failure before retrying.');el(p,'p','Selected tools: '+(m.selected_tools||[]).join(' → '));
    const bs=el(p,'div',undefined,'vd-badges');badge(bs,'Execution: '+m.display_execution_status);badge(bs,'Validation: '+m.validation_decision);badge(bs,'Critic: '+m.critic_decision);
    el(p,'p','Representative rule: valid artifact → most complete required metrics → earliest valid attempt. Scores do not select the diagnostic representative.','vd-meta');
    attemptsTable(detail(p,'All attempts, including historical failures'),m.attempts||[]);
    if(m.modality==='SMALL_MOLECULE'){el(p,'div',metrics.cross_seed_status,'vd-status');table(p,metrics.fresh_comparisons||[],[['Pose','pose_rank'],['AF3 seed','seed'],['Sample','sample'],['Ligand RMSD Å','heavy_atom_rmsd_angstrom'],['Receptor CA RMSD Å','receptor_ca_rmsd_angstrom'],['Mapped residues','receptor_matched_residues']]);}
    if(m.modality==='DE_NOVO_BINDER'){el(p,'div','RFD3 backbone → ProteinMPNN sequence → AF3 complex → interface QC → developability screening','vd-status');table(p,[{iptm:metrics.iptm,ptm:metrics.ptm,score:metrics.protein_mpnn_score,contacts:metrics.interface?.interface_contact_count}],[['iPTM','iptm'],['pTM','ptm'],['ProteinMPNN design score (not affinity)','score'],['Interface atom contacts','contacts']]);el(p,'p','Warnings: '+(metrics.developability?.warnings||[]).join(', '));}
    if(m.modality==='ADC'){el(p,'div','Computationally ranked conjugation-site candidates. No experimentally validated site is claimed. Linker/payload: NOT CONFIGURED · DAR: NOT RUN · internalization/cytotoxicity: NOT EVALUATED','vd-status');}
    if(m.modality==='DEGRADER'&&metrics.input_mode==='published_full_molecule')renderReference(p,m);
    if(m.modality==='DEGRADER'&&metrics.input_mode!=='published_full_molecule'){table(p,metrics.readiness||[],[['Component / field','input'],['Status','status']]);el(p,'div','Assembly: BLOCKED_INPUT · Geometry: NOT RUN · Ternary prediction: NOT RUN. Reference positive control is excluded.','vd-status');detail(p,'Required explicit input schema',{warhead_smiles:metrics.warhead_smiles,e3_ligand_smiles:null,linker_smiles:null,warhead_map:null,e3_map:null,linker_maps:[null,null]});}
    (metrics.input_mode==='published_full_molecule'?[]:m.visualizations||[]).forEach(path=>{const a=art(path);if(!a?.available)return;const f=el(p,'figure'),img=el(f,'img');img.src=a.href;img.alt=a.title;const cap=el(f,'figcaption');el(cap,'strong',a.title+' · FRESH ANALYSIS');el(cap,'p',a.caption);(a.source_tables||[a.source_table]).forEach((src,i)=>link(cap,src,'Source '+(i+1)));});
    if(m.modality==='SMALL_MOLECULE')table(detail(p,'All ADMET endpoints and available/missing status'),metrics.admet_endpoints||[],[['Endpoint','endpoint_name'],['Value','endpoint_value'],['Unit','endpoint_unit'],['Status','value_status']]);
    if(m.modality==='ADC')table(detail(p,'All computational conjugation candidates'),metrics.conjugation?.candidates||[],[['Rank','review_rank'],['Chain','chain'],['Residue',r=>r.residue+r.residue_id],['SASA Å²','sasa_angstrom2'],['CDR distance Å','cdr_distance_angstrom'],['Interface distance Å','interface_distance_angstrom'],['Excluded reasons','exclusion_reasons'],['Position',r=>[r.x,r.y,r.z]]]);
    detail(p,'Metrics, source linkage and parser checks',{metrics,checks:m.diagnostic_checks});detail(p,'Validation and Critic evidence',{validation:m.validation,critic:m.critic});issuesTable(p,m.issues||[]);
  });
  const ip=tab('Issues');el(ip,'p','P0 blocks execution/reporting. P1 affects interpretation or demo quality. P2 is follow-up scientific work. Confirmed and hypothetical causes are kept separate.');issuesTable(ip,issues);
  const prov=tab('Provenance');el(prov,'p','Therapeutic source: '+s.therapeutic_source_run_id+' · Prior competition report: '+s.competition_source_run_id);el(prov,'p','REAL ARTIFACT REPLAY = prior real outputs; FRESH ANALYSIS = new CPU calculations and plots; FRESH INFERENCE = new model execution (0). REFERENCE DEMO is not used.');
  mods.filter(m=>m.previous_attempt).forEach(m=>{const old=detail(prov,'Previous Degrader attempt · TAK-285-only input · BLOCKED_INPUT',m.previous_attempt);link(old,m.previous_attempt_path,'Preserved attempt');detail(prov,'Curated ingestion versus runtime selection',m.decision_trace);});
  detail(prov,'GPU snapshot and process ownership',s.gpu);detail(prov,'Representative policy',s.representative_policy);attemptsTable(detail(prov,'Complete historical and current attempt manifest'),attempts);
  const checks=(s.artifact_checks||[]).map(a=>({...a,filename:a.path?.split('/').pop()}));table(detail(prov,'Artifact checksums, sizes and parser results'),checks,[['File','filename'],['Bytes','size_bytes'],['SHA256','sha256'],['Checksum','checksum_status'],['Parsed','parser_success'],['Source run','source_run_id']]);
  const links=detail(prov,'Download figures, source tables, structures and manifests');(d.artifacts||[]).forEach(a=>{const line=el(links,'p');link(line,a.path,a.title||a.path.split('/').pop());el(line,'span',' · '+a.execution_mode,'muted');});
  const all=el(nav,'button','All sections');all.id='show-all';all.onclick=()=>show('All sections');show('Small molecule');return true;
}

function renderCompetitionDemo(d){
  const host=document.querySelector('.report-body')||document.querySelector('.content')||document.body;
  host.replaceChildren();host.id='competition-demo';
  document.title='OmiCraft · Competition demo';
  const title=document.querySelector('.title');if(title)title.textContent='OmiCraft · Competition demo';
  const rq=document.querySelector('.rq');if(rq)rq.textContent='Comparative tool demonstration · No clinical or scientific selection';
  const style=document.createElement('style');style.textContent=`
    #competition-demo{max-width:1280px;margin:auto;padding:24px;color:#dee7ef;font:14px/1.55 system-ui}
    #competition-demo h2{font-size:23px;margin:20px 0 12px;color:#fff}
    #competition-demo h3{font-size:18px;margin:18px 0 10px;color:#dcecf2}
    #competition-demo .cards,#competition-demo .figures{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:16px 0}
    #competition-demo .card,#competition-demo section{background:#141f2b;border:1px solid #344455;border-radius:12px;padding:20px;margin-bottom:18px}
    #competition-demo .card strong{display:block;color:#71d7c4;font-size:18px}
    #competition-demo table{width:100%;border-collapse:collapse;margin:14px 0;font-size:12px}
    #competition-demo th,#competition-demo td{border-bottom:1px solid #344455;text-align:left;padding:9px;vertical-align:top;overflow-wrap:anywhere}
    #competition-demo th{color:#9fbac8} #competition-demo figure{margin:0;background:#fff;border-radius:8px;overflow:hidden;color:#233243}
    #competition-demo img{display:block;width:100%;height:auto} #competition-demo figcaption{padding:12px;font-size:12px}
    #competition-demo a{color:#56aaee} #competition-demo figure a{color:#176095}
    #competition-demo details{border-top:1px solid #344455;padding:12px 0} #competition-demo pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px}
    #competition-demo .status{padding:12px;border-left:3px solid #daa35d;background:#1f2933;margin:10px 0}
    #competition-demo .flow{color:#8ed4c5;line-height:2} #competition-demo .scroll{overflow-x:auto}
  `;host.appendChild(style);
  const add=(parent,tag,text,cls)=>{const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;parent.appendChild(el);return el;};
  const value=v=>v===null||v===undefined?'not_available':Array.isArray(v)?v.map(value).join(', '):typeof v==='object'?JSON.stringify(v):String(v);
  const table=(parent,rows,fields)=>{const wrap=add(parent,'div',undefined,'scroll');const t=add(wrap,'table');const h=add(t,'tr');fields.forEach(k=>add(h,'th',k));rows.forEach(row=>{const tr=add(t,'tr');fields.forEach(k=>add(tr,'td',value(row[k])));});return t;};
  const detail=(parent,label,data)=>{const box=add(parent,'details');add(box,'summary',label);add(box,'pre',JSON.stringify(data,null,2));return box;};
  const section=(name,id)=>{const s=add(host,'section');s.id=id;add(s,'h2',name);return s;};
  const modalities=d.summary?.modalities||[];
  const status=section('Competition demo status','demo-status');

      const body=t.createTBody();rows.forEach(row=>{const tr=body.insertRow();fields.forEach(key=>{const value=row[key];tr.insertCell().textContent=value==null?'—':typeof value==='object'?JSON.stringify(value):String(value);});});
    }
    if(d.modality==='DE_NOVO_BINDER'){
      metricsTable('Binder candidates',summary.candidates||[],['candidate_id','final_verdict','failure_reasons']);
      for(const target of summary.targets||[])if(target.failure_reasons?.length)add('p',target.failure_reasons.join(' · '));
    }
    if(d.modality==='ADC'){
      metricsTable('Antibody structure assessment',[summary],['numbering_status','cdr_mapping_status','cdr_heavy_atom_contacts','cdr_contact_residues','severe_clashes']);
      metricsTable('Conjugation candidates',summary.conjugation?.candidates||[],['review_rank','chain','residue_id','residue','sasa_angstrom2','cdr_distance_angstrom','exclusion_reasons']);
      add('p','Linker/payload selection, DAR, internalization and experimental efficacy remain NOT EVALUATED.');
    }
    if(d.modality==='DEGRADER'){
      metricsTable('Reference chemistry',[summary.qc||{}],['molecular_formula','molecular_weight','conformer_generation_status','conformer_identity_preserved']);
      add('p','Ternary: '+(summary.ternary_status||'NOT_EVALUATED')+' · Experimental degradation: NOT_EVALUATED');
      metricsTable('Ternary inputs',summary.ternary_readiness?.sequences||[],['entity','available','chain','sequence_length']);
      metricsTable('AF3 ternary samples',summary.ternary_prediction?.samples||[],['seed','sample_id','af3_status','iptm','ptm','chain_pair_metrics','error_message']);
    }
    for(const artifact of d.artifacts||[])if(artifact.available&&/\.(png|jpg|jpeg|svg)$/i.test(artifact.path||'')){
      renderReportFigure(container,artifact);
    }
  }
  add('h3',upstream?'결과 파일':'Artifacts').id='upstream-files';
  for(const artifact of d.artifacts||[]){
    const el=add(artifact.available?'a':'p',artifact.label||artifact.path);
    if(artifact.available){el.href=artifact.href;el.style.display='block';}
    else el.append(' (not available through this server)');
  }
  const details=add('details','');
  const caption=document.createElement('summary');caption.textContent='Metrics and provenance';details.appendChild(caption);
  const pre=document.createElement('pre');pre.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere';
  pre.textContent=JSON.stringify({summary:d.summary,validation:d.validation,critic:d.critic,readiness:d.readiness,selection:d.selection_event,stages:d.stages},null,2);
  details.appendChild(pre);
  return true;
}
</script>
